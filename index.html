const uid=()=>'x'+Math.random().toString(36).substr(2,9);
const DAYS_ALL=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const fmtT=t=>{if(!t)return'';const[h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM';const hr=h>12?h-12:h===0?12:h;return`${hr}:${m.toString().padStart(2,'0')} ${ap}`;};
const getDOW=()=>['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date().getDay()];
const todayStr=()=>new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
const getEntry=(tt,day,pid)=>tt.entries.find(e=>e.day===day&&e.periodId===pid);
const getSubj=(tt,id)=>tt.subjects.find(s=>s.id===id);
const getFac=(tt,id)=>tt.faculty.find(f=>f.id===id);
const cntSubj=(tt,sid)=>tt.entries.filter(e=>e.subjectId===sid).length;
const isBreak=t=>t==='coffee-break'||t==='meal-break'||t==='break';
const getInitials=name=>{if(!name)return'?';const p=name.replace(/^(Dr\.|Prof\.|Mr\.|Ms\.|Mrs\.)\s*/i,'').split(' ');return(p[0]?.[0]||'')+(p[1]?.[0]||'');};

// Cross-timetable faculty conflict checker
const checkCrossConflict=(allTTs,currentTT,facultyId,day,period)=>{
  const fac=getFac(currentTT,facultyId);
  if(!fac||!period||!allTTs)return[];
  const hits=[];
  allTTs.forEach(t=>{
    if(t.id===currentTT.id)return;
    t.entries.forEach(e=>{
      if(e.day!==day)return;
      const tFac=getFac(t,e.facultyId);
      if(!tFac||tFac.name!==fac.name)return;
      const tPer=t.periods.find(p=>p.id===e.periodId);
      if(!tPer||isBreak(tPer.type))return;
      if(period.startTime<tPer.endTime&&tPer.startTime<period.endTime){
        hits.push({ttName:t.name,section:t.section||t.classYear||'',period:tPer});
      }
    });
  });
  return hits;
};

const validate=(tt,allTTs=[])=>{
  const issues=[],warnings=[];
  tt.subjects.forEach(s=>{
    const c=cntSubj(tt,s.id);
    if(c<s.periodsPerWeek)warnings.push(`${s.name}: ${c}/${s.periodsPerWeek} assigned — needs ${s.periodsPerWeek-c} more`);
    else if(c>s.periodsPerWeek)issues.push(`${s.name}: ${c}/${s.periodsPerWeek} — over-assigned by ${c-s.periodsPerWeek}`);
  });
  // Same-timetable faculty double-booking check
  const fm={};
  tt.entries.forEach(e=>{
    const k=`${e.facultyId}_${e.day}_${e.periodId}`;
    if(fm[k]){const f=getFac(tt,e.facultyId);issues.push(`Faculty conflict (same timetable): ${f?.name||'Unknown'} double-booked on ${e.day}`);}
    fm[k]=true;
  });
  // Cross-timetable faculty conflict check
  tt.entries.forEach(e=>{
    const period=tt.periods.find(p=>p.id===e.periodId);
    if(!period||isBreak(period.type))return;
    const cx=checkCrossConflict(allTTs,tt,e.facultyId,e.day,period);
    if(cx.length>0){
      const f=getFac(tt,e.facultyId);
      cx.forEach(c=>issues.push(`Cross-timetable conflict: ${f?.name} is also assigned in "${c.ttName}" (${c.section}) on ${e.day} at ${fmtT(c.period.startTime)}`));
    }
  });
  return{issues,warnings};
};

const autoGen=tt=>{
  const cps=tt.periods.filter(p=>!isBreak(p.type));
  const reqs=[];
  tt.subjects.forEach(s=>{for(let i=0;i<s.periodsPerWeek;i++)reqs.push({sid:s.id,fid:s.facultyId||''});});
  const slots=[];
  tt.workingDays.forEach(d=>cps.forEach(p=>slots.push({day:d,periodId:p.id})));
  for(let i=slots.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[slots[i],slots[j]]=[slots[j],slots[i]];}
  const entries=[],used=new Set(),fu={};
  let ri=0;
  for(const sl of slots){
    if(ri>=reqs.length)break;
    const req=reqs[ri];
    const sk=`${sl.day}_${sl.periodId}`,fk=`${req.fid}_${sl.day}_${sl.periodId}`;
    if(!used.has(sk)&&!fu[fk]){
      used.add(sk);if(req.fid)fu[fk]=true;
      entries.push({id:uid(),day:sl.day,periodId:sl.periodId,subjectId:req.sid,facultyId:req.fid});ri++;
    }
  }
  return{...tt,entries};
};

// Cell assign modal - with cross-timetable conflict detection
const CellModal=({tt,day,period,entry,onAssign,onClear,onClose,allTimetables})=>{
  const[ss,setSS]=useState(entry?.subjectId||'');
  const[sf,setSF]=useState(entry?.facultyId||'');
  const chgS=sid=>{setSS(sid);const s=tt.subjects.find(x=>x.id===sid);if(s?.facultyId)setSF(s.facultyId);};

  // Real-time cross-timetable conflict check
  const crossConflicts=sf?checkCrossConflict(allTimetables,tt,sf,day,period):[];
  // Over-assignment check
  const overAssigned=ss&&(()=>{
    const s=tt.subjects.find(x=>x.id===ss);
    const c=cntSubj(tt,ss);
    const ov=entry?.subjectId===ss?c>s.periodsPerWeek:c>=s.periodsPerWeek;
    return ov?{subj:s,count:c}:null;
  })();

  return(
    <div className="overlay" onClick={onClose}>
      <div className="modal" style={{maxWidth:440}} onClick={e=>e.stopPropagation()}>
        <div className="modal-hdr">
          <div>
            <h3 style={{fontSize:'0.93rem',fontWeight:700,color:'#1E3A5F'}}>{entry?'Edit Assignment':'Assign Subject'}</h3>
            <p style={{fontSize:'0.73rem',color:'#6B7080',marginTop:'0.18rem'}}>{day} · {fmtT(period.startTime)} – {fmtT(period.endTime)}</p>
          </div>
          <button onClick={onClose} style={{background:'none',border:'none',fontSize:'1.2rem',cursor:'pointer',color:'#6B7080'}}>×</button>
        </div>
        <div className="modal-body">
          <div className="fg">
            <label className="lbl">Subject</label>
            <select className="sel" value={ss} onChange={e=>chgS(e.target.value)}>
              <option value="">— Select subject —</option>
              {tt.subjects.map(s=>{
                const c=cntSubj(tt,s.id);
                return<option key={s.id} value={s.id}>{s.name} ({c}/{s.periodsPerWeek} assigned)</option>;
              })}
            </select>
          </div>
          <div className="fg">
            <label className="lbl">Faculty</label>
            <select className="sel" value={sf} onChange={e=>setSF(e.target.value)}>
              <option value="">— Select faculty —</option>
              {tt.faculty.map(f=>{
                const perWeek=tt.entries.filter(e=>e.facultyId===f.id).length;
                return<option key={f.id} value={f.id}>{f.name}{f.department?` — ${f.department}`:''} ({perWeek} periods/wk)</option>;
              })}
            </select>
          </div>
          {/* Show selected faculty info */}
          {sf&&(()=>{
            const f=getFac(tt,sf);
            if(!f)return null;
            const periods=tt.entries.filter(e=>e.facultyId===sf).length;
            return<div className="info-box">
              <strong>{f.name}</strong>{f.department&&<span> · {f.department}</span>}
              {f.email&&<span style={{marginLeft:'0.5rem',opacity:0.8}}>{f.email}</span>}
              <div style={{marginTop:'0.3rem',fontSize:'0.73rem'}}>{periods} periods/week{f.maxPerWeek?` · max ${f.maxPerWeek}/week`:''}{f.maxPerDay?` · max ${f.maxPerDay}/day`:''}</div>
            </div>;
          })()}
          {/* Cross-timetable conflict warning */}
          {crossConflicts.length>0&&(
            <div className="conflict-box">
              <div style={{fontWeight:700,marginBottom:'0.3rem'}}>⚠ Faculty Conflict Detected</div>
              {crossConflicts.map((c,i)=>(
                <div key={i} style={{marginTop:'0.2rem'}}>• {getFac(tt,sf)?.name} is already assigned in <strong>"{c.ttName}"</strong>{c.section&&` (${c.section})`} on {day} at {fmtT(c.period.startTime)}–{fmtT(c.period.endTime)}</div>
              ))}
            </div>
          )}
          {/* Over-assignment warning */}
          {overAssigned&&(
            <div className="warn-box">⚠ {overAssigned.subj.name} already has {overAssigned.count}/{overAssigned.subj.periodsPerWeek} periods. Adding more exceeds the weekly limit.</div>
          )}
          {tt.faculty.length===0&&(
            <div className="warn-box">⚠ No faculty added yet. Close this and click <strong>👥 Faculty</strong> in the toolbar to add faculty members first.</div>
          )}
        </div>
        <div className="modal-foot">
          {entry&&<button className="btn btn-outline btn-sm" style={{marginRight:'auto',color:'#DC2626',borderColor:'#DC2626'}} onClick={onClear}>Clear Period</button>}
          <button className="btn btn-outline btn-sm" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary btn-sm" onClick={()=>onAssign(ss,sf)} disabled={!ss||!sf} style={{opacity:(!ss||!sf)?0.5:1}}>
            {crossConflicts.length>0?'⚠ Assign Anyway':'Assign'}
          </button>
        </div>
      </div>
    </div>
  );
};

const TimetableGrid=({tt,editable,onChange,showToast,allTimetables})=>{
  const[cellModal,setCellModal]=useState(null);
  const[dragEntry,setDragEntry]=useState(null);
  const[dragOver,setDragOver]=useState(null);
  const days=tt.workingDays;
  const cols=`116px repeat(${days.length},1fr)`;

  const clickCell=(day,period)=>{
    if(!editable||isBreak(period.type))return;
    setCellModal({day,period,entry:getEntry(tt,day,period.id)});
  };
  const doAssign=(day,pid,sid,fid)=>{
    if(!sid||!fid)return;
    const ne=tt.entries.filter(e=>!(e.day===day&&e.periodId===pid));
    ne.push({id:uid(),day,periodId:pid,subjectId:sid,facultyId:fid});
    onChange({...tt,entries:ne});setCellModal(null);showToast('success','Subject assigned.');
  };
  const doClear=(day,pid)=>{onChange({...tt,entries:tt.entries.filter(e=>!(e.day===day&&e.periodId===pid))});setCellModal(null);showToast('success','Period cleared.');};
  const dStart=(e,entry)=>{setDragEntry(entry);e.dataTransfer.effectAllowed='move';};
  const dDrop=(e,day,pid,period)=>{
    e.preventDefault();setDragOver(null);
    if(!dragEntry||!editable)return;
    const cx=checkCrossConflict(allTimetables,tt,dragEntry.facultyId,day,period);
    if(cx.length>0){showToast('error',`⚠ Faculty conflict: ${getFac(tt,dragEntry.facultyId)?.name} is already assigned in another class at this time.`);return;}
    const ne=tt.entries.filter(e=>e.id!==dragEntry.id&&!(e.day===day&&e.periodId===pid));
    ne.push({...dragEntry,id:uid(),day,periodId:pid});
    onChange({...tt,entries:ne});setDragEntry(null);showToast('success','Entry moved.');
  };

  return(
    <>
    <div className="tt-grid" style={{display:'grid',gridTemplateColumns:cols}}>
      <div className="tt-hdr tt-hdr-left">Time</div>
      {days.map(d=><div key={d} className="tt-hdr">{d}</div>)}
      {tt.periods.map(period=>{
        if(isBreak(period.type))return<BreakRow key={period.id} period={period} days={days}/>;
        return(
          <React.Fragment key={period.id}>
            <div className="tt-time">
              <span style={{fontWeight:700,color:'#1E3A5F',fontSize:'0.68rem'}}>{period.name}</span>
              <span>{fmtT(period.startTime)}</span>
              <span>{fmtT(period.endTime)}</span>
            </div>
            {days.map(d=>{
              const entry=getEntry(tt,d,period.id);
              const s=entry?getSubj(tt,entry.subjectId):null;
              const f=entry?getFac(tt,entry.facultyId):null;
              const ck=`${d}_${period.id}`;
              return(
                <div key={d}
                  className={`tt-cell${dragOver===ck?' drag-over':''}`}
                  onClick={()=>clickCell(d,period)}
                  onDragOver={e=>{e.preventDefault();setDragOver(ck);}}
                  onDragLeave={()=>setDragOver(null)}
                  onDrop={e=>dDrop(e,d,period.id,period)}
                >
                  {s?(
                    <div
                      className={`subj-card${dragEntry?.id===entry.id?' dragging':''}`}
                      style={{background:s.bg||'#F3F4F6',borderLeftColor:s.color||'#6B7280'}}
                      draggable={editable}
                      onDragStart={e=>{e.stopPropagation();dStart(e,entry);}}
                      onClick={e=>{e.stopPropagation();if(editable)clickCell(d,period);}}
                    >
                      <div className="subj-name" style={{color:s.color}}>{s.name}</div>
                      {f&&<div className="subj-fac" title={f.name}>{f.name}</div>}
                    </div>
                  ):(
                    editable&&<div style={{height:'100%',display:'flex',alignItems:'center',justifyContent:'center',color:'#CCC5BC',fontSize:'0.68rem'}}>+ Add</div>
                  )}
                </div>
              );
            })}
          </React.Fragment>
        );
      })}
    </div>
    {cellModal&&(
      <CellModal tt={tt} day={cellModal.day} period={cellModal.period} entry={cellModal.entry}
        allTimetables={allTimetables}
        onAssign={(s,f)=>doAssign(cellModal.day,cellModal.period.id,s,f)}
        onClear={()=>doClear(cellModal.day,cellModal.period.id)}
        onClose={()=>setCellModal(null)}/>
    )}
    </>
  );
};

const Builder=({tt,onChange,onBack,onDelete,showToast,allTimetables})=>{
  const[showVal,setShowVal]=useState(false);
  const[confPub,setConfPub]=useState(false);
  const[confAuto,setConfAuto]=useState(false);
  const[confDel,setConfDel]=useState(false);
  const[showFacMgr,setShowFacMgr]=useState(false);
  const[downloading,setDownloading]=useState(false);

  const doDownload=async(fmt='png')=>{
    const el=document.getElementById('tt-capture');
    if(!el){showToast('error','Could not find timetable to capture.');return;}
    if(!window.html2canvas){showToast('warning','Image library still loading — please try again in a moment.');return;}
    setDownloading(true);
    showToast('warning','Generating image…');
    try{
      const canvas=await window.html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false,allowTaint:true});
      const link=document.createElement('a');
      const safeName=(tt.name||'timetable').replace(/[^a-z0-9\s]/gi,'').trim().replace(/\s+/g,'_');
      if(fmt==='jpg'){
        link.download=`${safeName}_timetable.jpg`;
        link.href=canvas.toDataURL('image/jpeg',0.95);
      } else {
        link.download=`${safeName}_timetable.png`;
        link.href=canvas.toDataURL('image/png');
      }
      link.click();
      showToast('success',`Timetable downloaded as ${fmt.toUpperCase()}!`);
    }catch(e){
      showToast('error','Download failed. Try using Print (Ctrl+P / Cmd+P) instead.');
    }
    setDownloading(false);
  };
  const val=validate(tt,allTimetables);
  const doPub=()=>{onChange({...tt,status:tt.status==='published'?'draft':'published'});setConfPub(false);showToast('success',tt.status==='published'?'Unpublished.':'Published!');};
  const doAuto=()=>{onChange(autoGen(tt));setConfAuto(false);showToast('success','Auto-generated! Review and adjust.');};
  const doSave=()=>{onChange({...tt,updatedAt:new Date().toISOString().split('T')[0]});showToast('success','Saved as draft.');};
  const totalIssues=val.issues.length+val.warnings.length;
  return(
    <div>
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:'1rem'}}>
        <div>
          <button className="btn btn-outline btn-sm" style={{marginBottom:'0.5rem'}} onClick={onBack}>← Dashboard</button>
          <div style={{fontSize:'1.3rem',fontWeight:700,color:'#1E3A5F',lineHeight:1.2}}>{tt.name}</div>
          <div style={{fontSize:'0.79rem',color:'#6B7080',marginTop:'0.25rem'}}>{tt.institution} · {tt.department} · {tt.startDate} – {tt.endDate}</div>
        </div>
        <span className={`badge ${tt.status==='published'?'bdg-green':'bdg-amber'}`} style={{fontSize:'0.74rem',padding:'0.28rem 0.75rem',marginTop:'0.3rem'}}>{tt.status}</span>
      </div>

      <div className="card" style={{padding:'0.7rem 1rem',marginBottom:'0.9rem'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:'0.5rem',flexWrap:'wrap'}}>
          <div style={{display:'flex',gap:'0.45rem',flexWrap:'wrap'}}>
            <button className="btn btn-outline btn-sm" onClick={doSave}>💾 Save</button>
            <button className="btn btn-sm" style={{background:showVal?'#1E3A5F':'white',color:showVal?'white':'#1E3A5F',border:'1.5px solid #D0C8BA'}} onClick={()=>setShowVal(!showVal)}>
              {totalIssues>0?`⚠ ${totalIssues} Issue${totalIssues>1?'s':''}`:val.issues.length===0&&val.warnings.length===0?'✓ No Issues':'Validate'}
            </button>
            <button className="btn btn-outline btn-sm" onClick={()=>setConfAuto(true)}>⚡ Auto Generate</button>
            <button className="btn btn-outline btn-sm" style={{background:'#EFF6FF',color:'#1D4ED8',borderColor:'#BFDBFE'}} onClick={()=>setShowFacMgr(true)}>👥 Faculty ({tt.faculty.length})</button>
            <div style={{position:'relative',display:'inline-block'}}>
              <button className="btn btn-outline btn-sm" style={{background:'#F0FDF4',color:'#15803D',borderColor:'#BBF7D0',gap:'0.4rem'}} onClick={()=>doDownload('png')} disabled={downloading}>
                {downloading?'⏳ Generating…':'📥 Download PNG'}
              </button>
            </div>
            <button className="btn btn-outline btn-sm" style={{color:'#6B7080'}} onClick={()=>doDownload('jpg')} disabled={downloading}>JPG</button>
          </div>
          <div style={{display:'flex',gap:'0.45rem'}}>
            <button className={`btn btn-sm ${tt.status==='published'?'btn-outline':'btn-green'}`} onClick={()=>setConfPub(true)}>
              {tt.status==='published'?'⊘ Unpublish':'✓ Publish'}
            </button>
            <button className="btn btn-red btn-sm" onClick={()=>setConfDel(true)}>🗑 Delete</button>
          </div>
        </div>
      </div>

      {showVal&&(
        <div className="card" style={{marginBottom:'0.9rem'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'0.65rem'}}>
            <div style={{fontWeight:700,color:'#1E3A5F',fontSize:'0.87rem'}}>Validation Results</div>
            <button onClick={()=>setShowVal(false)} style={{background:'none',border:'none',cursor:'pointer',color:'#6B7080',fontSize:'1.1rem'}}>×</button>
          </div>
          {val.issues.length===0&&val.warnings.length===0
            ?<div style={{color:'#16A34A',fontSize:'0.83rem'}}>✓ All checks passed — no conflicts detected.</div>
            :<>
              {val.issues.map((m,i)=><div key={i} className="val-row"><span style={{color:'#DC2626',fontWeight:700,flexShrink:0}}>✗</span><span>{m}</span></div>)}
              {val.warnings.map((m,i)=><div key={i} className="val-row"><span style={{color:'#D97706',fontWeight:700,flexShrink:0}}>⚠</span><span>{m}</span></div>)}
            </>}
        </div>
      )}

      {tt.faculty.length===0&&(
        <div className="warn-box" style={{marginBottom:'0.9rem'}}>
          ⚠ No faculty added yet. Click <strong>👥 Faculty</strong> above to add faculty members before assigning classes.
        </div>
      )}

      <div style={{display:'grid',gridTemplateColumns:'1fr 252px',gap:'1rem',alignItems:'start'}}>
        <div>
          {/* Capture area — this entire div becomes the downloaded image */}
          <div id="tt-capture" style={{background:'white',padding:'1.25rem',borderRadius:'12px',border:'1px solid #E8E2D6'}}>
            {/* Export header */}
            <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',borderBottom:'2px solid #1E3A5F',paddingBottom:'0.75rem',marginBottom:'0.9rem'}}>
              <div>
                <div style={{fontSize:'1.05rem',fontWeight:800,color:'#1E3A5F'}}>{tt.name}</div>
                <div style={{fontSize:'0.75rem',color:'#6B7080',marginTop:'0.2rem'}}>
                  {tt.institution&&<span>{tt.institution} · </span>}
                  {tt.department&&<span>{tt.department}</span>}
                  {tt.program&&<span> · {tt.program}</span>}
                </div>
                <div style={{fontSize:'0.7rem',color:'#9B9690',marginTop:'0.12rem'}}>
                  {tt.classYear&&<span>{tt.classYear}</span>}
                  {tt.section&&<span> · {tt.section}</span>}
                  {tt.academicYear&&<span> · {tt.academicYear}</span>}
                </div>
              </div>
              <div style={{textAlign:'right'}}>
                <div style={{fontSize:'0.7rem',color:'#6B7080'}}>Validity Period</div>
                <div style={{fontSize:'0.78rem',fontWeight:600,color:'#1E3A5F'}}>{tt.startDate||'—'} – {tt.endDate||'—'}</div>
                <span style={{display:'inline-flex',alignItems:'center',padding:'0.15rem 0.5rem',borderRadius:'20px',fontSize:'0.65rem',fontWeight:600,background:tt.status==='published'?'#DCFCE7':'#FEF3C7',color:tt.status==='published'?'#15803D':'#B45309',marginTop:'0.25rem'}}>{tt.status}</span>
              </div>
            </div>
            <TimetableGrid tt={tt} editable={true} onChange={onChange} showToast={showToast} allTimetables={allTimetables}/>
            {/* Export footer */}
            <div style={{borderTop:'1px solid #EDE9E0',marginTop:'0.75rem',paddingTop:'0.5rem',display:'flex',justifyContent:'space-between',fontSize:'0.65rem',color:'#B0A898'}}>
              <span>LMS Timetable Manager</span>
              <span>Generated: {new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</span>
            </div>
          </div>
          <div style={{fontSize:'0.68rem',color:'#9B9690',marginTop:'0.45rem'}}>Click a cell to assign · Drag cards to rearrange · Faculty conflicts checked automatically</div>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:'0.85rem'}}>
          <FreqPanel tt={tt}/>
          <TodayPanel tt={tt}/>
          <div className="freq-p">
            <div style={{fontWeight:700,color:'#1E3A5F',fontSize:'0.83rem',marginBottom:'0.6rem'}}>Faculty Load</div>
            {tt.faculty.length===0?<div style={{fontSize:'0.75rem',color:'#9B9690'}}>No faculty added.</div>:
            tt.faculty.map(f=>{
              const periods=tt.entries.filter(e=>e.facultyId===f.id).length;
              const over=f.maxPerWeek&&periods>f.maxPerWeek;
              return<div key={f.id} style={{padding:'0.3rem 0',borderBottom:'1px solid #F0EEE8'}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                  <div style={{display:'flex',alignItems:'center',gap:'0.4rem',minWidth:0}}>
                    <div className="fac-avatar" style={{width:22,height:22,fontSize:'0.6rem'}}>{getInitials(f.name)}</div>
                    <span style={{fontSize:'0.76rem',fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{f.name}</span>
                  </div>
                  <span className={`badge ${over?'bdg-red':'bdg-blue'}`} style={{flexShrink:0,marginLeft:'0.3rem'}}>{periods}{f.maxPerWeek?`/${f.maxPerWeek}`:''}</span>
                </div>
              </div>;
            })}
          </div>
          {/* Breaks legend */}
          <div className="freq-p">
            <div style={{fontWeight:700,color:'#1E3A5F',fontSize:'0.83rem',marginBottom:'0.6rem'}}>Breaks Schedule</div>
            {tt.periods.filter(p=>isBreak(p.type)).length===0
              ?<div style={{fontSize:'0.75rem',color:'#9B9690'}}>No breaks configured.</div>
              :tt.periods.filter(p=>isBreak(p.type)).map(p=>(
                <div key={p.id} style={{display:'flex',alignItems:'center',gap:'0.5rem',padding:'0.3rem 0',borderBottom:'1px solid #F0EEE8',fontSize:'0.76rem'}}>
                  <span>{p.type==='meal-break'?'🍽':'☕'}</span>
                  <span style={{fontWeight:600}}>{p.name}</span>
                  <span style={{color:'#6B7080',marginLeft:'auto'}}>{fmtT(p.startTime)}–{fmtT(p.endTime)}</span>
                </div>
              ))}
          </div>
        </div>
      </div>

      {showFacMgr&&<FacultyModal tt={tt} onChange={onChange} onClose={()=>setShowFacMgr(false)} showToast={showToast}/>}
      {confPub&&<Confirm title={tt.status==='published'?'Unpublish?':'Publish Timetable?'}
        msg={tt.status==='published'?'Students and faculty will no longer see this.':'Students and faculty can access this once published.'}
        onConfirm={doPub} onCancel={()=>setConfPub(false)} confirmTxt={tt.status==='published'?'Unpublish':'Publish'}/>}
      {confAuto&&<Confirm title="Auto-Generate Timetable?" msg="This replaces all current assignments. You can edit afterwards."
        onConfirm={doAuto} onCancel={()=>setConfAuto(false)} confirmTxt="Generate"/>}
      {confDel&&<Confirm title="Delete Timetable?" msg={`"${tt.name}" will be permanently deleted. This cannot be undone.`}
        onConfirm={()=>{onDelete(tt.id);setConfDel(false);}} onCancel={()=>setConfDel(false)} confirmTxt="Delete Timetable" danger/>}
    </div>
  );
};

const WIZARD_STEPS=['Basic Info','Working Days','Periods & Breaks','Subjects','Faculty'];
const COLORS=['#2563EB','#7C3AED','#16A34A','#D97706','#DB2777','#DC2626','#0891B2'];
const BGS=['#DBEAFE','#EDE9FE','#DCFCE7','#FEF3C7','#FCE7F3','#FEE2E2','#CFFAFE'];

const Wizard=({onSave,onClose,showToast})=>{
  const[step,setStep]=useState(1);
  const[info,setInfo]=useState({name:'',academicYear:'2026-2027',institution:'',department:'',program:'',classYear:'',section:'',status:'draft',startDate:'',endDate:''});
  const[days,setDays]=useState(['Monday','Tuesday','Wednesday','Thursday','Friday']);
  const[periods,setPeriods]=useState([
    {id:uid(),name:'Period 1',startTime:'08:30',endTime:'09:30',type:'class'},
    {id:uid(),name:'Coffee Break',startTime:'09:30',endTime:'09:45',type:'coffee-break'},
    {id:uid(),name:'Period 2',startTime:'09:45',endTime:'10:45',type:'class'},
    {id:uid(),name:'Period 3',startTime:'10:45',endTime:'11:45',type:'class'},
    {id:uid(),name:'Lunch Break',startTime:'11:45',endTime:'12:30',type:'meal-break'},
    {id:uid(),name:'Period 4',startTime:'12:30',endTime:'13:30',type:'class'},
  ]);
  const[subjects,setSubjects]=useState([{id:uid(),name:'',code:'',type:'Theory',periodsPerWeek:4,color:COLORS[0],bg:BGS[0],facultyId:''}]);
  const[faculty,setFaculty]=useState([{id:uid(),name:'',employeeId:'',department:'',email:'',maxPerDay:4,maxPerWeek:20}]);
  const togDay=d=>setDays(p=>p.includes(d)?p.filter(x=>x!==d):[...p,d]);
  const addS=()=>{const i=subjects.length%COLORS.length;setSubjects(p=>[...p,{id:uid(),name:'',code:'',type:'Theory',periodsPerWeek:3,color:COLORS[i],bg:BGS[i],facultyId:''}]);};
  const addF=()=>setFaculty(p=>[...p,{id:uid(),name:'',employeeId:'',department:'',email:'',maxPerDay:4,maxPerWeek:20}]);
  const updP=(id,k,v)=>{
    setPeriods(p=>p.map(x=>{
      if(x.id!==id)return x;
      let updated={...x,[k]:v};
      // Auto-name breaks
      if(k==='type'&&v==='meal-break'&&x.name.toLowerCase().includes('break')&&!x.name.toLowerCase().includes('lunch'))updated.name='Lunch Break';
      if(k==='type'&&v==='coffee-break'&&(x.name.toLowerCase().includes('break')&&!x.name.toLowerCase().includes('coffee')))updated.name='Coffee Break';
      if(k==='type'&&v==='class'&&(x.name.toLowerCase().includes('break')||x.name.toLowerCase().includes('lunch')))updated.name=`Period ${p.filter(q=>q.type==='class').length+1}`;
      return updated;
    }));
  };
  const updS=(id,k,v)=>setSubjects(p=>p.map(x=>x.id===id?{...x,[k]:v}:x));
  const updF=(id,k,v)=>setFaculty(p=>p.map(x=>x.id===id?{...x,[k]:v}:x));
  const doSave=()=>{
    if(!info.name.trim()){showToast('error','Timetable name is required.');return;}
    const facList=faculty.filter(f=>f.name.trim());
    const subjList=subjects.filter(s=>s.name.trim());
    onSave({id:uid(),...info,workingDays:days,periods,subjects:subjList,faculty:facList,entries:[],createdAt:new Date().toISOString().split('T')[0],updatedAt:new Date().toISOString().split('T')[0]});
  };
  const tiny={fontSize:'0.79rem',padding:'0.36rem 0.55rem'};
  const typeLabel=t=>t==='class'?'Class Period':t==='coffee-break'?'☕ Coffee Break':t==='meal-break'?'🍽 Meal Break':'Break';
  const typeColor=t=>t==='meal-break'?'#FFF7F0':t==='coffee-break'?'#FFFDF5':'white';
  return(
    <div className="overlay">
      <div className="modal modal-lg" onClick={e=>e.stopPropagation()}>
        <div className="modal-hdr">
          <div>
            <div style={{fontSize:'1rem',fontWeight:700,color:'#1E3A5F'}}>Create New Timetable</div>
            <div style={{fontSize:'0.73rem',color:'#6B7080',marginTop:'0.15rem'}}>Step {step} of {WIZARD_STEPS.length}: {WIZARD_STEPS[step-1]}</div>
          </div>
          <button onClick={onClose} style={{background:'none',border:'none',fontSize:'1.2rem',cursor:'pointer',color:'#6B7080'}}>×</button>
        </div>
        <div style={{padding:'0.9rem 1.3rem 0'}}>
          <div className="steps">
            {WIZARD_STEPS.map((l,i)=>(
              <React.Fragment key={i}>
                <div style={{display:'flex',alignItems:'center',gap:'0.28rem'}}>
                  <div className={`st-num ${step>i+1?'st-done':step===i+1?'st-active':'st-up'}`}>{step>i+1?'✓':i+1}</div>
                  <span className="st-lbl" style={{color:step>i+1?'#16A34A':step===i+1?'#1E3A5F':'#9B9690'}}>{l}</span>
                </div>
                {i<WIZARD_STEPS.length-1&&<div className={`st-line ${step>i+1?'st-line-done':''}`}/>}
              </React.Fragment>
            ))}
          </div>
        </div>
        <div className="modal-body" style={{maxHeight:'52vh',overflowY:'auto'}}>
          {step===1&&(
            <div className="g2">
              {[['Timetable Name *','name','text','e.g. B.Sc CS Sem 3 — Section A'],['Academic Year','academicYear','text',''],['Institution','institution','text',''],['Department','department','text',''],['Program / Course','program','text','e.g. B.Sc Computer Science'],['Class / Semester','classYear','text','e.g. Semester 3'],['Section / Batch','section','text','e.g. Section A']].map(([l,k,t,ph])=>(
                <div key={k} className="fg">
                  <label className="lbl">{l}</label>
                  <input type={t} className="inp" value={info[k]} onChange={e=>setInfo(p=>({...p,[k]:e.target.value}))} placeholder={ph}/>
                </div>
              ))}
              <div className="fg"><label className="lbl">Status</label>
                <select className="sel" value={info.status} onChange={e=>setInfo(p=>({...p,status:e.target.value}))}>
                  <option value="draft">Draft</option><option value="published">Published</option>
                </select>
              </div>
              <div className="fg"><label className="lbl">Start Date</label><input type="date" className="inp" value={info.startDate} onChange={e=>setInfo(p=>({...p,startDate:e.target.value}))}/></div>
              <div className="fg"><label className="lbl">End Date</label><input type="date" className="inp" value={info.endDate} onChange={e=>setInfo(p=>({...p,endDate:e.target.value}))}/></div>
            </div>
          )}
          {step===2&&(
            <div>
              <p style={{fontSize:'0.8rem',color:'#6B7080',marginBottom:'0.75rem'}}>Select the days your institution operates.</p>
              <div style={{display:'flex',gap:'0.5rem',flexWrap:'wrap',marginBottom:'0.9rem'}}>

              </div>

                <button className="btn btn-outline btn-sm" onClick={()=>setDays(['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'])}>Mon–Sat</button>

                  <input type="time" className="inp" style={{...tiny,background:'white'}} value={p.startTime} onChange={e=>updP(p.id,'startTime',e.target.value)}/>
                  <input type="time" className="inp" style={{...tiny,background:'white'}} value={p.endTime} onChange={e=>updP(p.id,'endTime',e.target.value)}/>

              </div>
              {faculty.map(f=>(
                <div key={f.id} style={{display:'grid',gridTemplateColumns:'2fr 1fr 1fr 2fr 0.7fr 0.7fr auto',gap:'0.35rem',alignItems:'center',marginBottom:'0.35rem'}}>
                  <input className="inp" style={tiny} value={f.name} onChange={e=>updF(f.id,'name',e.target.value)} placeholder="Dr. Full Name"/>
                  <input className="inp" style={tiny} value={f.employeeId} onChange={e=>updF(f.id,'employeeId',e.target.value)} placeholder="EMP001"/>
                  <input className="inp" style={tiny} value={f.department} onChange={e=>updF(f.id,'department',e.target.value)} placeholder="Dept"/>
                  <input type="email" className="inp" style={tiny} value={f.email} onChange={e=>updF(f.id,'email',e.target.value)} placeholder="email@edu"/>
                  <input type="number" className="inp" style={tiny} value={f.maxPerDay} min={1} max={10} onChange={e=>updF(f.id,'maxPerDay',+e.target.value)}/>
                  <input type="number" className="inp" style={tiny} value={f.maxPerWeek} min={1} max={40} onChange={e=>updF(f.id,'maxPerWeek',+e.target.value)}/>
                  <button style={{background:'none',border:'none',cursor:'pointer',color:'#DC2626',fontSize:'0.95rem'}} onClick={()=>setFaculty(x=>x.filter(q=>q.id!==f.id))}>✕</button>
                </div>
              ))}
              <button className="btn btn-outline btn-sm" style={{marginTop:'0.65rem'}} onClick={addF}>+ Add Faculty</button>
            </div>
          )}
        </div>
        <div className="modal-foot">
          {step>1&&<button className="btn btn-outline btn-sm" onClick={()=>setStep(s=>s-1)}>← Back</button>}
          <span style={{flex:1}}/>
          <button className="btn btn-outline btn-sm" onClick={onClose}>Cancel</button>
          {step<WIZARD_STEPS.length
            ?<button className="btn btn-primary btn-sm" onClick={()=>setStep(s=>s+1)} style={{opacity:step===1&&!info.name?0.5:1}} disabled={step===1&&!info.name}>Next →</button>
            :<button className="btn btn-green btn-sm" onClick={doSave}>✓ Create Timetable</button>}
        </div>
      </div>
    </div>
  );
};

              <circle cx="44" cy="10" r="4" fill="#D97706"/>

              <rect x="28" y="32" width="8" height="6" rx="2" fill="#C8C0B0"/>
              <rect x="42" y="32" width="8" height="6" rx="2" fill="#C8C0B0"/>
              <rect x="14" y="44" width="8" height="6" rx="2" fill="#C8C0B0"/>
              <rect x="28" y="44" width="8" height="6" rx="2" fill="#D97706"/>
              <rect x="42" y="44" width="8" height="6" rx="2" fill="#C8C0B0"/>
            </svg>
          </div>
          <div style={{fontSize:'1.05rem',fontWeight:700,color:'#1E3A5F',marginBottom:'0.45rem'}}>No timetables yet</div>
          <div style={{fontSize:'0.83rem',color:'#6B7080',marginBottom:'1.2rem'}}>Create a timetable to organise classes, subjects, faculty, and periods.</div>
          <button className="btn btn-primary" onClick={onCreate}>+ Create Timetable</button>

      ):(
        <div className="card" style={{padding:0,overflow:'hidden'}}>
          <div style={{padding:'0.9rem 1.1rem',borderBottom:'1px solid #EDE9E0',display:'flex',alignItems:'center',justifyContent:'space-between'}}>

    </div>
  );
};

function App(){
  useEffect(()=>{
    const el=document.createElement('style');
    el.textContent=CSS;
    document.head.appendChild(el);
    return()=>document.head.removeChild(el);
  },[]);

  const[timetables,setTimetables]=useState([]);
  const[active,setActive]=useState(null);
  const[view,setView]=useState('dashboard');
  const[showWizard,setShowWizard]=useState(false);
  const[toasts,setToasts]=useState([]);
  const[loading,setLoading]=useState(true);
  const[saveStatus,setSaveStatus]=useState(''); // 'saving' | 'saved' | 'error' | ''

  // Handle OAuth redirect — code flow (response_type=code) + implicit fallback
  useEffect(()=>{
    // Code flow: Zoho redirects with ?code=XXX&accounts-server=XXX
    const qp=new URLSearchParams(window.location.search);
    const code=qp.get('code');
    const acctServer=qp.get('accounts-server')||'https://accounts.zoho.com';
    if(code){
      window.history.replaceState(null,'',window.location.pathname);
      (async()=>{
        try{
          // Use standard Zoho token URL (accounts-server from redirect as fallback)
          const tokenUrl=acctServer&&acctServer!==ZV_AUTH_URL.replace('/oauth/v2/auth','')
            ?`${acctServer}/oauth/v2/token`
            :ZV_TOKEN_URL;
          const body=new URLSearchParams({
            grant_type:'authorization_code',
            client_id:ZV_CLIENT_ID,
            client_secret:ZV_CLIENT_SECRET,
            redirect_uri:window.location.href.split('?')[0].split('#')[0],
            code
          });
          const resp=await fetch(tokenUrl,{
            method:'POST',
            headers:{'Content-Type':'application/x-www-form-urlencoded'},
            body
          });
          const data=await resp.json();
          if(data.access_token){
            localStorage.setItem('zoho_access_token',data.access_token);
            if(data.refresh_token)localStorage.setItem('zoho_refresh_token',data.refresh_token);
            if(data.api_domain)localStorage.setItem('zoho_api_domain',data.api_domain.replace('https://',''));
            setTimeout(()=>showToast('success','Connected to Zoho Vertical! Open Faculty Manager and click Sync Faculty.'),600);
          } else {
            setTimeout(()=>showToast('error','Token exchange failed: '+(data.error_description||data.error||JSON.stringify(data))),600);
          }
        }catch(e){
          setTimeout(()=>showToast('error','Token exchange error — CORS may be blocking. Try allowing the redirect URI in Zoho Vertical trusted domains. Details: '+e.message),800);
        }
      })();
      return;
    }
    // Implicit fallback: token returned directly in URL hash
    const hash=window.location.hash;
    if(hash&&hash.includes('access_token=')){
      const params={};
      hash.substring(1).split('&').forEach(p=>{
        const[k,...v]=p.split('=');
        if(k)params[decodeURIComponent(k)]=decodeURIComponent(v.join('=')||'');
      });
      if(params.access_token){
        localStorage.setItem('zoho_access_token',params.access_token);
        window.history.replaceState(null,'',window.location.pathname+window.location.search);
        setTimeout(()=>showToast('success','Connected to Zoho Vertical! Open Faculty Manager and click Sync Faculty.'),600);
      }
    }
  },[]);

  // Load from persistent storage on mount
  useEffect(()=>{
    const load=()=>{
      try{
        const raw=localStorage.getItem('lms_timetables_v3');const result=raw?{value:raw}:null;
        if(result&&result.value){
          const saved=JSON.parse(result.value);
          if(Array.isArray(saved)&&saved.length>0){
            setTimetables(saved);
          } else {
            setTimetables([]);
          }
        } else {
          setTimetables([]);
        }
      } catch(e){
        setTimetables([]);
      }
      setLoading(false);
    };
    load();
  },[]);

  // Save to persistent storage whenever timetables change
  useEffect(()=>{
    if(loading)return;
    const save=()=>{
      setSaveStatus('saving');
      try{
        localStorage.setItem('lms_timetables_v3',JSON.stringify(timetables));
        setSaveStatus('saved');
        setTimeout(()=>setSaveStatus(''),2200);
      } catch(e){
        setSaveStatus('error');
        setTimeout(()=>setSaveStatus(''),3000);
      }
    };
    const timer=setTimeout(save,600); // debounce 600ms
    return()=>clearTimeout(timer);
  },[timetables,loading]);

  const showToast=(type,msg)=>{const id=uid();setToasts(p=>[...p,{id,type,msg}]);setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),3500);};
  const openTT=(tt,dest='builder')=>{setActive(tt);setView(dest);};
  const updateTT=newTT=>{setActive(newTT);setTimetables(p=>p.map(t=>t.id===newTT.id?newTT:t));};
  const createTT=tt=>{setTimetables(p=>[...p,tt]);setActive(tt);setView('builder');setShowWizard(false);showToast('success','Timetable created and saved! Click 👥 Faculty to add faculty.');};
  const deleteTT=id=>{setTimetables(p=>p.filter(t=>t.id!==id));if(active?.id===id){setActive(null);setView('dashboard');}};
  const dupTT=tt=>{const n={...tt,id:uid(),name:`${tt.name} (Copy)`,status:'draft',entries:tt.entries.map(e=>({...e,id:uid()})),faculty:tt.faculty.map(f=>({...f,id:uid()})),createdAt:new Date().toISOString().split('T')[0]};setTimetables(p=>[...p,n]);showToast('success','Duplicated.');};
  const resetData=async()=>{
    try{localStorage.removeItem('lms_timetables_v3');}catch(e){}
    setTimetables([]);setActive(null);setView('dashboard');
    showToast('success','Data reset to defaults.');
  };
  const navClick=id=>{
    if((id==='builder'||id==='faculty'||id==='student')&&!active){
      if(timetables.length>0){setActive(timetables[0]);setView(id);}else showToast('warning','Create a timetable first.');return;
    }
    if(id==='dashboard'){setView('dashboard');return;}setView(id);
  };
  const NAV=[{id:'dashboard',label:'Dashboard',icon:'📊'},{id:'builder',label:'Builder',icon:'🏗'},{id:'faculty',label:'Faculty View',icon:'👨\u200d🏫'},{id:'student',label:'Student View',icon:'👩\u200d🎓'}];

  if(loading) return(
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',background:'#F0EEE8',flexDirection:'column',gap:'1rem'}}>
      <div style={{fontSize:'2.5rem'}}>📚</div>
      <div style={{fontSize:'1rem',fontWeight:600,color:'#1E3A5F'}}>Loading LMS Timetable…</div>
      <div style={{fontSize:'0.8rem',color:'#9B9690'}}>Restoring your saved data</div>
    </div>
  );

  return(
    <div className="app">
      <aside className="sidebar">
        <div className="sb-brand">
          <div style={{fontSize:'1.1rem',marginBottom:'0.25rem'}}>📚</div>
          <div className="sb-title">LMS Timetable</div>
          
        </div>
        <nav className="sidebar-nav">
          <div className="nav-sec">Main</div>
          {NAV.map(n=>(
            <div key={n.id} className={`nav-item${view===n.id?' active':''}`} onClick={()=>navClick(n.id)}>
              <span>{n.icon}</span>{n.label}
            </div>
          ))}
          {timetables.length>0&&<>
            <div className="nav-sec" style={{marginTop:'0.5rem'}}>Timetables</div>
            {timetables.map(tt=>(
              <div key={tt.id} className={`nav-item${active?.id===tt.id&&view==='builder'?' active':''}`} onClick={()=>openTT(tt,'builder')} style={{fontSize:'0.76rem',paddingLeft:'1rem'}}>
                <span style={{width:7,height:7,borderRadius:'50%',background:tt.status==='published'?'#16A34A':'#D97706',flexShrink:0,display:'inline-block'}}/>
                <span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1}}>{tt.name}</span>
              </div>
            ))}
          </>}
        </nav>
        <div style={{padding:'0.85rem',borderTop:'1px solid rgba(255,255,255,0.1)',display:'flex',flexDirection:'column',gap:'0.5rem'}}>
          <button className="btn btn-amber btn-sm" style={{justifyContent:'center',width:'100%'}} onClick={()=>setShowWizard(true)}>+ New Timetable</button>
          {/* Save status indicator */}
          {saveStatus&&(
            <div style={{textAlign:'center',fontSize:'0.65rem',color:saveStatus==='saved'?'#86EFAC':saveStatus==='error'?'#FCA5A5':'rgba(255,255,255,0.5)',display:'flex',alignItems:'center',justifyContent:'center',gap:'0.3rem'}}>
              {saveStatus==='saving'&&<span className="save-dot"/>}
              {saveStatus==='saved'&&'✓ All changes saved'}
              {saveStatus==='saving'&&'Saving…'}
              {saveStatus==='error'&&'⚠ Save failed'}
            </div>
          )}
          <button onClick={resetData} style={{background:'none',border:'none',cursor:'pointer',color:'rgba(255,255,255,0.28)',fontSize:'0.63rem',textAlign:'center',padding:'0.2rem'}}>Reset to defaults</button>
        </div>
      </aside>
      <main className="main">
        {view==='dashboard'&&<Dashboard timetables={timetables} onOpen={openTT} onCreate={()=>setShowWizard(true)} onDelete={deleteTT} onDuplicate={dupTT} showToast={showToast}/>}
        {view==='builder'&&active&&<Builder tt={active} onChange={updateTT} onBack={()=>setView('dashboard')} onDelete={id=>{deleteTT(id);setView('dashboard');}} showToast={showToast} allTimetables={timetables}/>}
        {view==='student'&&active&&<StudentView tt={active} onBack={()=>setView('dashboard')}/>}
        {view==='faculty'&&active&&<FacultyView tt={active} onBack={()=>setView('dashboard')}/>}
      </main>
      {showWizard&&<Wizard onSave={createTT} onClose={()=>setShowWizard(false)} showToast={showToast}/>}
      <Toast toasts={toasts}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
</body>
</html>
